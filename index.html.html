<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
  <meta name="theme-color" content="#045b43">
  <title>SICIBINAGA Kelas 7 — SMPN 3 Bangil</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      background: #045b43;
      overscroll-behavior: auto;
    }
    #sicibinaga-frame {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
      touch-action: auto;
      -webkit-overflow-scrolling: touch;
    }
  </style>
</head>
<body>
  <!-- GANTI URL DI BAWAH DENGAN URL DEPLOYMENT WEB APP GAS KELAS 7 (/exec) -->
  <iframe
    id="sicibinaga-frame"
    src="https://script.google.com/macros/s/AKfycbzNDVYXTpAgNJfzzCOzl854W3UGeBewULAk9lPB0wTKi70oBoKc6fjiEpQSqx-mCPHKqQ/exec"
    scrolling="yes"
    allow="fullscreen; microphone; camera; clipboard-read; clipboard-write"
    allowfullscreen>
  </iframe>

  <script>
    // V100 Top-Level Vercel Android Back Guard (0 Touch/Touchpad Blocking!)
    (function() {
      let appState = { loggedIn: false, isExamActive: false };
      let seq = 1;

      function pushTopCushion(fresh) {
        try {
          if (fresh) {
            history.replaceState({ siciTop: true, seq: ++seq }, '');
            history.pushState({ siciTop: true, seq: ++seq }, '');
          } else {
            history.pushState({ siciTop: true, seq: ++seq }, '');
          }
        } catch (e) {}
      }

      window.addEventListener('message', function(ev) {
        if (!ev || !ev.data || ev.data.type !== 'SICIBINAGA_V99_NAV_STATE') return;
        const wasLoggedIn = appState.loggedIn;
        appState = ev.data;
        if (appState.loggedIn && !wasLoggedIn) {
          pushTopCushion(true);
        }
      });

      window.addEventListener('popstate', function() {
        if (!appState.loggedIn) return;
        pushTopCushion(false);
        const frame = document.getElementById('sicibinaga-frame');
        if (frame && frame.contentWindow) {
          frame.contentWindow.postMessage({ type: 'SICIBINAGA_V99_ANDROID_BACK' }, '*');
        }
      });

      window.addEventListener('beforeunload', function(e) {
        if (appState.loggedIn) {
          e.preventDefault();
          e.returnValue = 'Sesi SICIBINAGA Kelas 7 masih aktif.';
          return e.returnValue;
        }
      });
    })();
  </script>
</body>
</html>
